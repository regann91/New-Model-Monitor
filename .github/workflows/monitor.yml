name: Hourly AI Changelog Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Run monitor script
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python monitor.py
        
      - name: Upload debug artifacts if Kie.ai check failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kie-debug
          path: |
            kie_debug.png
            kie_debug.html
          if-no-files-found: ignore
          
      - name: Commit and push updated cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_seen_posts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update monitor cache [skip ci]" && git push)
